<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Inserisci Album</title>
    <!-- Collegamento al foglio di stile -->
    <link rel="stylesheet" href="../assets/style/style.css">
</head>

<body>

    <!-- SEZIONE NAVIGAZIONE: logout + Torna al Menu -->
    <a href="../index.html" class="logout-btn">logout</a>
    <a href="menu.html" class="btn">Torna al Menu</a>
    <!-- TITOLO PAGINA -->
    <h2 class="Utente">Inserisci Album</h2>

    <!-- FORM DI INSERIMENTO ALBUM -->
    <form action="InserisciAlbum.php" method="POST">

        <!-- Campo titolo album -->
        <label class="subtitle">Titolo:</label>
        <input class="input-box" type="text" name="titolo" placeholder="inserisci il titolo dell'Album" required>

        <br><br>

        <!-- Campo anno di uscita -->
        <label class="subtitle">AnnoUscita:</label>
        <input class="input-box" type="number" name="Anno_uscita" placeholder="inserisci l'anno di uscita" required>

        <br><br>

        <!-- Select per scegliere l'artista (caricata via JS) -->
        <label class="subtitle" for="artista">Seleziona l'Artista:</label>
        <select class="input-box" name="id_artista" id="artista" required>
            <option value="">-- Caricamento artisti... --</option>
        </select>

        <!-- Bottone invio -->
        <button type="submit" class="btn">Salva Album</button>

        <!-- Script che carica gli artisti -->
        <script src="../assets/script/scriptart.js"></script>

        <!-- Script logout -->
        <script src="../assets/script/logout.js"></script>

    </form>

</body>
</html>
